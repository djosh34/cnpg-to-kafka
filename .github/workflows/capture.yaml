name: Capture

on:
  workflow_dispatch:
    inputs:
      cnpg_version:
        description: CloudNativePG version. Empty uses the version in scripts/capture/run.sh.
      k3s_version:
        description: k3s version. Empty uses the version in scripts/capture/run.sh.

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
      - name: Record
        env:
          CNPG_VERSION: ${{ inputs.cnpg_version }}
          K3S_VERSION: ${{ inputs.k3s_version }}
        run: bash scripts/capture/run.sh "$RUNNER_TEMP/capture"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cnpg-capture
          path: ${{ runner.temp }}/capture
          retention-days: 14
