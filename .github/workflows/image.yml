name: Scratch image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go test ./...
      - uses: docker/setup-buildx-action@v4
      - name: Build the final amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cnpg-to-kafka:scan
          provenance: false
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
      - name: Require zero known vulnerabilities
        run: |
          set -o pipefail
          trivy --version
          trivy image --image-src docker --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --config '' --ignorefile '' --timeout 15m \
            --format json --list-all-pkgs --output trivy-report.json \
            cnpg-to-kafka:scan
      - name: Show available scan output
        if: always()
        run: |
          set -o pipefail
          if [[ -s trivy-report.json ]]; then
            trivy convert --config '' --ignorefile '' --scanners vuln --format table \
              trivy-report.json | tee trivy-report.txt
          fi
      - name: Upload available scan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-report.json
          if-no-files-found: warn
      - name: Save the scanned image without rebuilding
        run: docker save cnpg-to-kafka:scan -o image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: scanned-image
          path: image.tar
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tags to point into main history
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v8
        with:
          name: scanned-image
      - name: Load the exact scanned artifact
        run: docker load -i image.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag cnpg-to-kafka:scan "$image:sha-$COMMIT"
          docker push "$image:sha-$COMMIT"
          if [[ "$REF" == refs/heads/main ]]; then
            tag=main
          else
            tag="$REF_NAME"
          fi
          docker tag cnpg-to-kafka:scan "$image:$tag"
          docker push "$image:$tag"
