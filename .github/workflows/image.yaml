name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check that the Collector imports no package named in .trivyignore
        run: |
          packages=$(sed -n 's/^# \([a-z0-9.-]*\/[^ ]*\)$/\1/p' .trivyignore)
          test "$(wc -l <<< "$packages")" -eq "$(grep -c '^[^#]' .trivyignore)"
          ! go list -deps ./cmd/collector | grep -F "$packages"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: cnpg-to-kafka:scan
          provenance: false
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
      - name: Scan
        run: |
          trivy image --image-src docker --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --timeout 15m cnpg-to-kafka:scan
      - name: Save the image
        if: github.event_name == 'push'
        run: docker save cnpg-to-kafka:scan -o image.tar
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: docker load -i image.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          for tag in "sha-$COMMIT" main; do
            docker tag cnpg-to-kafka:scan "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check that the owner pushed a version tag
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$ACTOR" == "$OWNER" ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image built on main and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tags=(--tag "$image:$TAG")
          prerelease=(--prerelease)
          if [[ "$TAG" != *-* ]]; then
            tags+=(--tag "$image:latest")
            prerelease=()
          fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-$COMMIT"
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
