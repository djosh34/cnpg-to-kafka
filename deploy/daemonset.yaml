apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cnpg-to-kafka
  namespace: observability
spec:
  selector:
    matchLabels:
      app: cnpg-to-kafka
  template:
    metadata:
      labels:
        app: cnpg-to-kafka
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      # During a Kafka outage the Collector can take longer than this to stop,
      # and Kubernetes then kills it. The queue in the state directory survives.
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/djosh34/cnpg-to-kafka:v0.4.1
          securityContext:
            # The pod logs and the state directory on the node belong to root.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/cnpg-to-kafka
            - name: config
              mountPath: /etc/cnpg-to-kafka/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tls
              mountPath: /etc/cnpg-to-kafka/tls
              readOnly: true
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/cnpg-to-kafka
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: cnpg-to-kafka-config
        - name: tls
          secret:
            secretName: cnpg-to-kafka-tls
            defaultMode: 0400
