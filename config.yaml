# Example configuration. Change the namespace, the excluded roles, the Kafka and
# registry addresses, the topic, the subject and the certificate paths to yours.
receivers:
  file_log/cnpg:
    # Pod logs are at /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log.
    # This reads every pod in the namespace "database".
    include: [/var/log/pods/database_*/*/*.log*]
    exclude: [/var/log/pods/*/*/*.gz]
    start_at: beginning
    include_file_path: true
    storage: file_storage
    max_log_size: 1MiB
    # The container operator of Collector v0.162 has a data race when it reads
    # several files at once, so read one file at a time. With max_batches 0 each
    # poll still reads every matched file.
    max_concurrent_files: 1
    max_batches: 0
    poll_interval: 200ms
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    operators:
      - type: container
        id: container
        on_error: drop
      # Keeps only pods whose name matches the regex. ".*" keeps all of them.
      - type: filter
        id: select-pods
        expr: 'not (resource["k8s.pod.name"] matches ".*")'
        on_error: drop
      # Lines that are not JSON are normal in pod logs. drop_quiet drops them
      # without logging an error for each.
      - type: json_parser
        id: cnpg-json
        parse_to: body
        on_error: drop_quiet
      - type: filter
        id: postgres-records
        expr: 'body.logger != "postgres" or body.record == nil'
        on_error: drop
      # LOGIN_FAILED is a FATAL record with SQLSTATE 28P01 or 28000, or with
      # 42501 and "permission denied for database". LOGIN is "connection
      # authorized:" or "replication connection authorized:". LOGOUT is
      # "disconnection:". Every other record gets "" and the next filter drops it.
      - type: add
        id: classify
        field: attributes.eventtype
        value: >-
          EXPR(body.record.error_severity == "FATAL" and
          (body.record.sql_state_code in ["28P01", "28000"] or
          (body.record.sql_state_code == "42501" and body.record.message != nil and
          body.record.message startsWith "permission denied for database "))
          ? "LOGIN_FAILED" : body.record.message != nil and
          (body.record.message startsWith "connection authorized:" or
          body.record.message startsWith "replication connection authorized:")
          ? "LOGIN" : body.record.message != nil and
          body.record.message startsWith "disconnection:" ? "LOGOUT" : "")
        on_error: drop
      - type: filter
        id: connection-events
        expr: 'attributes.eventtype == ""'
      # Drops logins and logouts of these roles. The match is exact and
      # case-sensitive. Their failed logins are still published.
      - type: filter
        id: excluded-roles
        expr: 'attributes.eventtype != "LOGIN_FAILED" and body.record.user_name in ["postgres", "streaming_replica"]'
        on_error: drop
      - type: add
        id: role
        field: attributes.role
        value: 'EXPR(body.record.user_name ?? "")'
      - type: add
        id: database
        field: attributes.database
        value: 'EXPR(body.record.database_name ?? "")'
      - type: add
        id: client
        field: attributes.hostname
        value: 'EXPR(body.record.connection_from ?? "")'
      # connection_from is host:port. Strip the port and the brackets of an
      # IPv6 address. A value without a port, such as [local], stays as it is.
      - type: regex_parser
        id: client-with-port
        if: 'attributes.hostname matches "^.+:[0-9]+$"'
        parse_from: attributes.hostname
        parse_to: attributes
        regex: '^\[?(?P<hostname>[^\]]+)\]?:[0-9]+$'
        on_error: drop

processors:
  avro:
    registry:
      urls: [https://registry-1.example.com:8081, https://registry-2.example.com:8081]
      subject: cnpg-connections-value
      version: latest # Or a version number in quotes, such as "3".
      request_timeout: 10s
      tls:
        ca_file: /etc/cnpg-to-kafka/tls/ca.crt
        cert_file: /etc/cnpg-to-kafka/tls/tls.crt
        key_file: /etc/cnpg-to-kafka/tls/tls.key

exporters:
  kafka/cnpg:
    brokers: [kafka.example.com:9093]
    client_id: cnpg-to-kafka
    logs:
      topic: cnpg-connections # Must exist. The Collector does not create it.
      encoding: raw
    tls:
      ca_file: /etc/cnpg-to-kafka/tls/ca.crt
      cert_file: /etc/cnpg-to-kafka/tls/tls.crt
      key_file: /etc/cnpg-to-kafka/tls/tls.key
    producer:
      required_acks: all # The Kafka client then also produces idempotently.
      allow_auto_topic_creation: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 67108864 # 64 MiB of serialized requests. The file on disk is larger.
      num_consumers: 1
      block_on_overflow: true

extensions:
  file_storage:
    directory: /var/lib/cnpg-to-kafka
    create_directory: true
    directory_permissions: "0700"
    fsync: true
    max_size: 268435456 # 256 MiB for each of the two database files.

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [file_log/cnpg]
      processors: [avro]
      exporters: [kafka/cnpg]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
