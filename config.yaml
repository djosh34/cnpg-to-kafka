# One native Collector configuration. Replace example endpoints, namespace,
# subject, role list, and mounted certificate paths for your installation.
receivers:
  filelog/cnpg:
    # Namespace selection is the database_ prefix in the standard pod-log path.
    include: [/var/log/pods/database_*/*/*.log*]
    exclude: [/var/log/pods/*/*/*.gz]
    start_at: beginning
    include_file_path: true
    storage: file_storage
    max_log_size: 1MiB
    # v0.162's native container parser has shared timestamp state: serialize
    # reads to avoid its multi-reader race. All matched files are still polled
    # in successive batches; zero max_batches means no per-poll source limit.
    max_concurrent_files: 1
    max_batches: 0
    poll_interval: 200ms
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    operators:
      - type: container
        id: container
        on_error: drop
      # Optional pod-name regex: .* means no extra restriction. This operates
      # on path metadata, before decoding unrelated application JSON.
      - type: filter
        id: select-pods
        expr: 'not (resource["k8s.pod.name"] matches ".*")'
        on_error: drop
      - type: json_parser
        id: cnpg-json
        parse_to: body
        on_error: drop
      - type: filter
        id: postgres-records
        expr: 'body.logger != "postgres" or body.record == nil'
        on_error: drop
      # Explicit authentication failures (class 28), or a narrowly recognized
      # database CONNECT denial (42501), not arbitrary FATAL/permission errors.
      # Receipt/authentication progress is ignored; replication authorization
      # is also a successful login unless its exact role is excluded.
      - type: add
        id: classify
        field: attributes.eventtype
        value: >-
          EXPR(body.record.error_severity == "FATAL" and
          (body.record.sql_state_code in ["28P01", "28000"] or
          (body.record.sql_state_code == "42501" and body.record.message != nil and
          body.record.message startsWith "permission denied for database "))
          ? "LOGIN_FAILED" : body.record.message != nil and
          (body.record.message startsWith "connection authorized:" or
          body.record.message startsWith "replication connection authorized:")
          ? "LOGIN" : body.record.message != nil and
          body.record.message startsWith "disconnection:" ? "LOGOUT" : "")
        on_error: drop
      - type: filter
        id: connection-events
        expr: 'attributes.eventtype == ""'
      # Exact, case-sensitive exclusions apply ONLY to successful sessions.
      - type: filter
        id: excluded-roles
        expr: 'attributes.eventtype != "LOGIN_FAILED" and body.record.user_name in ["postgres", "streaming_replica"]'
        on_error: drop
      - type: add
        id: role
        field: attributes.role
        value: 'EXPR(body.record.user_name ?? "")'
      - type: add
        id: database
        field: attributes.database
        value: 'EXPR(body.record.database_name ?? "")'
      - type: add
        id: client
        field: attributes.hostname
        value: 'EXPR(body.record.connection_from ?? "")'
      # PostgreSQL CSV connection_from is host:port; accept bracketed IPv6,
      # IPv4 and DNS hosts without DNS lookup. Bare hosts/[local] stay intact.
      - type: regex_parser
        id: client-with-port
        if: 'attributes.hostname matches "^.+:[0-9]+$"'
        parse_from: attributes.hostname
        parse_to: attributes
        regex: '^\[?(?P<hostname>[^\]]+)\]?:[0-9]+$'
        on_error: drop

processors:
  avro:
    registry:
      urls: [https://registry-1.example.com:8081, https://registry-2.example.com:8081]
      subject: cnpg-connections-value
      version: latest # Or a quoted positive decimal version, e.g. "3".
      request_timeout: 10s
      tls:
        ca_file: /etc/cnpg-to-kafka/tls/ca.crt
        cert_file: /etc/cnpg-to-kafka/tls/tls.crt
        key_file: /etc/cnpg-to-kafka/tls/tls.key
        include_system_ca_certs_pool: false
        insecure: false
        insecure_skip_verify: false

exporters:
  kafka/cnpg:
    brokers: [kafka.example.com:9093]
    client_id: cnpg-to-kafka
    logs:
      topic: cnpg-connections # Already provisioned externally.
      encoding: raw
    tls:
      ca_file: /etc/cnpg-to-kafka/tls/ca.crt
      cert_file: /etc/cnpg-to-kafka/tls/tls.crt
      key_file: /etc/cnpg-to-kafka/tls/tls.key
      include_system_ca_certs_pool: false
      insecure: false
      insecure_skip_verify: false
    producer:
      required_acks: all # Enables franz-go's default idempotent production.
      allow_auto_topic_creation: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 67108864 # 64 MiB serialized requests, not an on-disk byte count.
      num_consumers: 1
      block_on_overflow: true

extensions:
  file_storage:
    directory: /var/lib/cnpg-to-kafka
    create_directory: true
    directory_permissions: "0700"
    fsync: true
    max_size: 268435456 # 256 MiB per native bbolt database; leave filesystem headroom.

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog/cnpg]
      processors: [avro]
      exporters: [kafka/cnpg]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
