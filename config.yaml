# Example configuration. Change the namespace, the cnpg processor settings, the
# Kafka and registry addresses, the topic, the subject and the certificate paths
# to yours.
receivers:
  file_log/cnpg:
    # Pod logs are at /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log.
    # This reads every pod in the namespace "database".
    include: [/var/log/pods/database_*/*/*.log*]
    exclude: [/var/log/pods/*/*/*.gz]
    start_at: beginning
    include_file_path: true
    storage: file_storage
    max_log_size: 1MiB
    # The container operator of Collector v0.162 has a data race when it reads
    # several files at once, so read one file at a time. Each poll still reads
    # every matched file.
    max_concurrent_files: 1
    poll_interval: 200ms
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    # Sets the namespace and pod name that the cnpg processor keys its session
    # table by, and puts the log line in the body.
    operators:
      - type: container
        id: container
        on_error: drop

processors:
  cnpg:
    source_hostname: db1.example.com # Its IP address is looked up at startup.
    additional_fields:
      application_name: payments
    # The account type is ha for these roles, exact match, and npa otherwise.
    high_privilege_roles: [postgres, app_admin]
    # A login is not published when role, method and identity all match an
    # entry. A cert entry has common_name, the common name of the certificate,
    # in place of identity. A logout is not published when its role is in any
    # entry. Failed logins are always published.
    trusted_connections:
      - {role: postgres, method: peer, identity: postgres}
      - {role: streaming_replica, method: cert, common_name: streaming_replica}
  avro:
    registry:
      urls: [https://registry-1.example.com:8081, https://registry-2.example.com:8081]
      subject: cnpg-connections-value
      version: latest # Or a version number in quotes, such as "3".
      request_timeout: 10s
      tls:
        ca_file: /etc/cnpg-to-kafka/tls/ca.crt
        cert_file: /etc/cnpg-to-kafka/tls/tls.crt
        key_file: /etc/cnpg-to-kafka/tls/tls.key

exporters:
  kafka/cnpg:
    brokers: [kafka.example.com:9093]
    client_id: cnpg-to-kafka
    logs:
      topic: cnpg-connections # Must exist. The Collector does not create it.
      encoding: raw
    tls:
      ca_file: /etc/cnpg-to-kafka/tls/ca.crt
      cert_file: /etc/cnpg-to-kafka/tls/tls.crt
      key_file: /etc/cnpg-to-kafka/tls/tls.key
    producer:
      required_acks: all # The Kafka client then also produces idempotently.
      allow_auto_topic_creation: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 67108864 # 64 MiB of serialized requests. The file on disk is larger.
      num_consumers: 1
      block_on_overflow: true

extensions:
  file_storage:
    directory: /var/lib/cnpg-to-kafka
    create_directory: true
    directory_permissions: "0700"
    fsync: true
    max_size: 268435456 # 256 MiB for each of the two database files.

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [file_log/cnpg]
      processors: [cnpg, avro]
      exporters: [kafka/cnpg]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
