redpanda:
  data_directory: /var/lib/redpanda/data
  node_id: 0
  seed_servers: []
  rpc_server:
    address: 0.0.0.0
    port: 33145
  advertised_rpc_api:
    address: redpanda
    port: 33145
  kafka_api:
    - name: internal
      address: 0.0.0.0
      port: 9092
    - name: external
      address: 0.0.0.0
      port: 19092
  advertised_kafka_api:
    - name: internal
      address: redpanda
      port: 9092
    - name: external
      address: localhost
      port: 19092
  kafka_api_tls:
    - name: internal
      enabled: true
      require_client_auth: true
      truststore_file: /certs/ca.crt
      cert_file: /certs/server.crt
      key_file: /certs/server.key
    - name: external
      enabled: true
      require_client_auth: true
      truststore_file: /certs/ca.crt
      cert_file: /certs/server.crt
      key_file: /certs/server.key
  admin:
    - address: 0.0.0.0
      port: 9644
  auto_create_topics_enabled: false
  default_topic_replications: 1
schema_registry:
  schema_registry_api:
    - name: registry
      address: 0.0.0.0
      port: 8081
  schema_registry_api_tls:
    - name: registry
      enabled: true
      require_client_auth: true
      truststore_file: /certs/ca.crt
      cert_file: /certs/server.crt
      key_file: /certs/server.key
schema_registry_client:
  brokers:
    - address: redpanda
      port: 9092
  broker_tls:
    enabled: true
    truststore_file: /certs/ca.crt
    cert_file: /certs/client.crt
    key_file: /certs/client.key
rpk:
  kafka_api:
    brokers: [localhost:19092]
    tls:
      ca_file: /certs/ca.crt
      cert_file: /certs/client.crt
      key_file: /certs/client.key
